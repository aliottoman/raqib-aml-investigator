[pytest]
testpaths = tests
addopts = -ra --strict-config --strict-markers --cov=src --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=85
filterwarnings =
    ignore:The default datetime adapter is deprecated.*:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
markers =
    unit: fast, isolated business-logic tests
    integration: tests that cross application modules or use the temporary SQLite database
    contract: API, WebSocket, or external-adapter contract tests
    security: regression tests for trust-boundary and authorization controls
    eval: deterministic golden-case quality checks
    live: opt-in smoke tests that call configured OCI services
