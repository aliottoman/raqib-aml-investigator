# Render Blueprint — free, recorded-mode public deployment of Raqib.
# One Docker web service; Render injects PORT and terminates TLS (so the SPA's
# wss:// WebSocket works). No OCI credentials here — the public instance runs the
# recorded investigation. For a private live run, add OPENAI_API_KEY_CHICAGO +
# CHICAGO_PROJECT_OCID as service env vars (and mount an OCI config for Guardrails).
services:
  - type: web
    name: raqib
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/readiness
    autoDeploy: true
